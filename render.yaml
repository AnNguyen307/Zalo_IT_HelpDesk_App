services:
  - type: web
    name: zalo-it-helpdesk-pilot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_PROFILE
        value: free-hosting
      - key: APP_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://h5.zdn.vn
      - key: DB_PROVIDER
        value: postgres
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require
      - key: POSTGRES_POOL_MAX
        value: "4"
      - key: ATTACHMENT_STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: helpdesk-attachments
      - key: ZALO_AUTH_MODE
        value: zalo
      - key: ZALO_APP_SECRET
        sync: false
      - key: ZALO_MINI_APP_ID
        value: "4185582976193315701"
      - key: ZALO_OPEN_API_KEY
        sync: false
      - key: ZALO_BOT_ENABLED
        value: "false"
      - key: ZALO_BOT_TOKEN
        sync: false
      - key: ZALO_BOT_WEBHOOK_SECRET
        sync: false
      - key: ZALO_BOT_GENERATIVE_FALLBACK
        value: "true"
      - key: ZALO_BOT_GENERATIVE_MIN_CONFIDENCE
        value: "0.55"
      - key: ZALO_BOT_MAX_SELF_SERVICE_ATTEMPTS
        value: "3"
      - key: LEGACY_STAFF_LOGIN_ENABLED
        value: "true"
      - key: USER_ACCESS_TTL_MINUTES
        value: "60"
      - key: USER_REFRESH_TTL_DAYS
        value: "90"
      - key: USER_INVITE_TTL_HOURS
        value: "24"
      - key: RATE_LIMIT_INVITE_MAX
        value: "10"
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_CLOUD_ENABLED
        value: "true"
      - key: AI_REDACTION_ENABLED
        value: "true"
      - key: PLAYBOOK_GOVERNANCE_ENABLED
        value: "true"
      - key: MAX_ATTACHMENT_MB
        value: "10"
      - key: MAX_REPLY_UPLOAD_MB
        value: "10"
      - key: MAX_STORED_TICKETS
        value: "30"
      - key: MAX_TICKET_ATTACHMENT_MB
        value: "10"
