name: Zalo Mini App CI/CD
run-name: ${{ github.event_name == 'schedule' && 'Refresh Zalo deployment token' || format('Zalo Mini App - {0}', inputs.operation) }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - refresh-token
      api_base_url:
        description: "Current public HTTPS backend URL; required for deploy"
        required: false
        type: string
  schedule:
    - cron: "17 1 * * 0"

permissions:
  contents: read

concurrency:
  group: zalo-miniapp-cicd
  cancel-in-progress: false

jobs:
  deploy-or-refresh:
    name: Build, refresh credentials, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ZALO_APP_ID: ${{ vars.ZALO_APP_ID }}
      MINI_APP_ID: ${{ vars.MINI_APP_ID }}
      ZALO_APP_SECRET: ${{ secrets.ZALO_APP_SECRET }}
      ZALO_REFRESH_TOKEN: ${{ secrets.ZALO_REFRESH_TOKEN }}
      API_BASE_URL: ${{ inputs.api_base_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            miniapp/package-lock.json

      - name: Validate CI/CD configuration
        shell: bash
        run: |
          set -euo pipefail

          required_names=(
            ZALO_APP_ID
            MINI_APP_ID
            ZALO_APP_SECRET
            ZALO_REFRESH_TOKEN
          )

          for name in "${required_names[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions variable or secret: ${name}"
              exit 1
            fi
          done

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.operation }}" = "deploy" ]; then
            case "${API_BASE_URL:-}" in
              https://*) ;;
              *)
                echo "::error::api_base_url is required for deploy and must start with https://"
                exit 1
                ;;
            esac
          fi

      - name: Install Backend dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: backend
        run: npm ci

      - name: Run Production Pilot E2E gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: backend
        run: npm run test:pilot

      - name: Install Mini App dependencies
        working-directory: miniapp
        run: npm ci

      - name: Check public backend health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${API_BASE_URL%/}"

          echo "Checking ${BASE_URL}/health"

          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "$HEALTH_FILE"' EXIT

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --max-time 30 \
            --header "ngrok-skip-browser-warning: github-actions" \
            "${BASE_URL}/health" > "$HEALTH_FILE"

          EXPECTED_VERSION="$(node -p "require('./backend/package.json').version")"
          node - "$HEALTH_FILE" "$EXPECTED_VERSION" <<'NODE'
          const fs = require("fs");
          const [healthFile, expectedVersion] = process.argv.slice(2);
          const health = JSON.parse(fs.readFileSync(healthFile, "utf8"));
          if (health.ok !== true) throw new Error("Backend health is not ready");
          if (health.version !== expectedVersion) {
            throw new Error(`Backend version ${health.version || "unknown"} does not match release ${expectedVersion}`);
          }
          if (!Array.isArray(health.features) || !health.features.includes("production-pilot-e2e")) {
            throw new Error("Backend is missing the production-pilot-e2e readiness marker");
          }
          if (health.authentication?.userLogin !== "one-time-invite") {
            throw new Error("Backend one-time invite authentication is not ready");
          }
          NODE

          echo "Backend ${EXPECTED_VERSION} Production Pilot readiness passed."

      - name: Generate Mini App build environment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${API_BASE_URL%/}"

          {
            printf 'APP_ID=%s\n' "$MINI_APP_ID"
            printf 'VITE_API_BASE_URL=%s\n' "$BASE_URL"
          } > .env

          echo "Generated Mini App build configuration."

      - name: Build Mini App
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: miniapp
        run: npm run build

      - name: Validate project metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          test -d dist/assets
          test -f dist/app-config.json
          test -f app-config.json
          test -f zmp-cli.json

          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("zmp-cli.json", "utf8"));
            if (String(cfg.appId) !== String(process.env.MINI_APP_ID)) {
              throw new Error("zmp-cli.json appId does not match MINI_APP_ID");
            }
          '

          echo "Vite bundle size:"
          du -sh dist

      - name: Prepare ZMP www deployment directory
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail

          rm -rf www
          mkdir -p www
          cp -a dist/. www/

          # zmp-cli 4.x validates this exact path before upload.
          cp app-config.json www/app-config.json

          test -f www/index.html
          test -f www/app-config.json
          test -d www/assets
          test -n "$(find www/assets -maxdepth 1 -type f -name '*.js' -print -quit)"

          echo "ZMP bundle prepared at miniapp/www."
          find www -maxdepth 2 -type f -print | sort
          du -sh www

      - name: Install Zalo Mini App CLI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        run: npm install --global zmp-cli@4.0.3

      - name: Refresh and securely export Zalo credentials
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_OUTPUT="$(
            npx --no-install zmp-developer-token login \
              "$ZALO_APP_ID" \
              "$ZALO_APP_SECRET" \
              "$ZALO_REFRESH_TOKEN"
          )"

          ACCESS_TOKEN_VALUE="$(
            printf '%s\n' "$LOGIN_OUTPUT" |
              sed -n 's/^NEW_ACCESS_TOKEN=//p' |
              tail -n 1 |
              tr -d '\r'
          )"

          REFRESH_TOKEN_VALUE="$(
            printf '%s\n' "$LOGIN_OUTPUT" |
              sed -n 's/^NEW_REFRESH_TOKEN=//p' |
              tail -n 1 |
              tr -d '\r'
          )"

          unset LOGIN_OUTPUT

          if [ -z "$ACCESS_TOKEN_VALUE" ]; then
            echo "::error::Zalo login did not return NEW_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "$REFRESH_TOKEN_VALUE" ]; then
            echo "::error::Zalo login did not return NEW_REFRESH_TOKEN"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN_VALUE"
          echo "::add-mask::$REFRESH_TOKEN_VALUE"

          {
            printf 'NEW_ACCESS_TOKEN=%s\n' "$ACCESS_TOKEN_VALUE"
            printf 'NEW_REFRESH_TOKEN=%s\n' "$REFRESH_TOKEN_VALUE"
          } >> "$GITHUB_ENV"

          echo "Zalo credentials refreshed and masked successfully."

      - name: Save rotated Zalo refresh token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_SECRET_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing repository secret REPO_SECRET_PAT"
            exit 1
          fi

          printf '%s' "$NEW_REFRESH_TOKEN" | \
            gh secret set ZALO_REFRESH_TOKEN \
              --repo "$GITHUB_REPOSITORY"

          echo "Rotated ZALO_REFRESH_TOKEN was saved to GitHub Actions secrets."

      - name: Prepare authenticated ZMP deployment configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${API_BASE_URL%/}"
          umask 077

          {
            printf 'APP_ID=%s\n' "$MINI_APP_ID"
            printf 'VITE_API_BASE_URL=%s\n' "$BASE_URL"
          } > .env

          echo "Authenticated deployment configuration prepared."

      - name: Deploy Testing version to Zalo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail

          env -u ZMP_TOKEN \
            APP_ID="$MINI_APP_ID" \
            NEW_ACCESS_TOKEN="$NEW_ACCESS_TOKEN" \
            npx --no-install zmp-developer-token deploy "$MINI_APP_ID"

      - name: Remove ephemeral Mini App files
        if: always()
        working-directory: miniapp
        shell: bash
        run: |
          rm -f .env
          rm -rf www

      - name: Write workflow summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Zalo Mini App CI/CD succeeded"
            echo ""
            echo "- Operation: ${{ github.event_name == 'schedule' && 'refresh-token' || inputs.operation }}"
            echo "- Mini App ID: ${MINI_APP_ID}"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.operation }}" = "deploy" ]; then
              echo "- Deployment type: Testing"
              echo "- Backend: ${API_BASE_URL%/}"
              echo "- Commit: ${GITHUB_SHA}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
